(function () {
  var KEY = 'ideal.unlock', te = new TextEncoder();
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function u8b64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function put(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) { /* */ } }
  function derive(pw) {
    return crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (km) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, km, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function aes(raw, iv, data) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, data); });
  }

  function unwrap(kek) {
    var keys = P.keys || [];
    if (!keys.length) return Promise.resolve({ k: u8b64(kek), n: '', r: '' });   /* старая сборка с общим паролем */
    return keys.reduce(function (p, e) {
      return p.catch(function () { return aes(kek, b64(e.iv), b64(e.w)).then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); }); });
    }, Promise.reject());
  }
  function open(kek) {
    return unwrap(kek).then(function (e) {
      try { if (e.n) localStorage.setItem('ideal.auth', JSON.stringify({ name: e.n, role: e.r })); else localStorage.removeItem('ideal.auth'); } catch (x) { /* */ }
      return aes(b64(e.k), b64(P.iv), b64(P.ct));
    }).then(function (pt) {
      var html = new TextDecoder().decode(pt);
      /* заменять документ можно только после полной загрузки оболочки, иначе браузер допишет страницу внутрь неё */
      function swap() { document.open(); document.write(html); document.close(); }
      if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap, { once: true });
    });
  }

    open(b64(saved.k)).catch(function () { put(null); document.body.classList.remove('auto'); });
  }

    e.preventDefault();
    var b = document.getElementById('b'), err = document.getElementById('err'), pw = document.getElementById('pw').value;

  });
