      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct));
    }).then(function (pt) {
      var html = new TextDecoder().decode(pt);
      /* заменять документ можно только после полной загрузки оболочки, иначе браузер допишет страницу внутрь неё */
      function swap() { document.open(); document.write(html); document.close(); }
      if (document.readyState === 'complete') swap(); else window.addEventListener('load', swap, { once: true });
    });
  }
  var saved = get();
  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'Браузер не поддерживает защищённое открытие. Обновите браузер.'; return; }
  if (saved && saved.salt === P.salt && saved.k) {
    document.body.classList.add('auto');
    open(b64(saved.k)).catch(function () { put(null); document.body.classList.remove('auto'); });
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = document.getElementById('b'), err = document.getElementById('err'), pw = document.getElementById('pw').value;
    b.disabled = true; b.textContent = 'Проверяю…'; err.textContent = '';
    derive(pw).then(function (raw) {
      return open(raw).then(function () { put({ salt: P.salt, k: u8b64(raw) }); });
    }).catch(function () {
      err.textContent = 'Неверный пароль'; b.disabled = false; b.textContent = 'Войти';
    });
  });
})();
</script>
</body>
